name: Deploy SAAIL Lab to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Deploy SAAIL Lab to inyalala.github.io

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - name: Copy to inyalala.github.io
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git clone https://github.com/inyalala/inyalala.github.io.git
          rm -rf inyalala.github.io/saail-lab
          mkdir -p inyalala.github.io/saail-lab
          cp -r dist/* inyalala.github.io/saail-lab/
          cd inyalala.github.io
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add saail-lab/
          git commit -m "Update saail-lab subdirectory"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/inyalala/inyalala.github.io.git

name: Deploy Faculty Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows:
      - "Refresh Google Scholar Metrics"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.guard.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Guard against unchanged Monday Scholar workflow_run
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          HEAD_TS=$(git log -1 --pretty=%ct)
          RUN_TS=$(date -d "${{ github.event.workflow_run.created_at }}" +%s)
          if [ "$HEAD_SUBJECT" = "chore: refresh Google Scholar metrics" ] && [ "$HEAD_TS" -ge "$RUN_TS" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new Scholar metrics commit generated; skipping redundant Pages rebuild."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-deploy
    if: ${{ needs.check-deploy.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "command=ci" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "manager=npm" >> "$GITHUB_OUTPUT"
          echo "command=install" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ${{ steps.detect-package-manager.outputs.command }}

      - name: Build Astro static site
        run: npm run build

      - name: Audit built dist output
        run: python scripts/audit_sites.py --dist-only --ci

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

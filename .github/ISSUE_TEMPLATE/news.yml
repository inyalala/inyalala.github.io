name: Post news
description: Add an item to the news page. Fill this in from your phone; a pull request is created for you.
title: "[news] "
labels: ["news"]
body:
  - type: markdown
    attributes:
      value: |
        Anything you submit here becomes a news entry on the site after you merge
        the pull request it creates. Nothing is published by submitting this form.

  - type: input
    id: headline
    attributes:
      label: Headline
      description: One line. Written as you would say it out loud.
      placeholder: SAAIL Lab paper accepted at Deep Learning Indaba 2026
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: What happened
      description: Two or three sentences is plenty. Plain text, no formatting needed.
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD. Leave blank for today.
      placeholder: 2026-08-02

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Publication
        - Conference
        - Teaching
        - Lab
        - Award
        - Talk
        - Media
        - Other
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link
      description: Optional. Paper, conference page, institute announcement, LinkedIn post.
      placeholder: https://

  - type: input
    id: image
    attributes:
      label: Image
      description: Optional. Path to an image already in images/, or a URL.
      placeholder: images/example.webp

  - type: input
    id: source
    attributes:
      label: Source credit
      description: Optional. If this came from an IITMZ page or a conference site, name them here so the entry attributes it.
      placeholder: IIT Madras Zanzibar
